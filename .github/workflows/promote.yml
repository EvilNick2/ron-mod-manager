name: Promote dev to main

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

jobs:
  open-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Create PR to main if none open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...dev" --jq .ahead_by)" = "0" ]; then
            echo "dev has no commits ahead of main, nothing to do"; exit 0
          fi
          if [ "$(gh pr list --base main --head dev --state open --json number --jq length)" != "0" ]; then
            echo "PR already open, new commits are included automatically"; exit 0
          fi
          gh pr create --base main --head dev \
            --title "chore: promote dev to main" \
            --body "Automated PR. Merge with a merge commit so individual conventional commits reach release-please."

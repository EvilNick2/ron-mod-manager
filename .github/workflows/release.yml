name: Release and Update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  determine-version:
    needs: release-please
    # A merged release PR builds its new tag. A manual run rebuilds the version main currently holds.
    if: |
      always() &&
      (needs.release-please.outputs.released == 'true' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      release_tag: ${{ steps.check.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read release tag
        id: check
        env:
          RELEASED_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          pkg_version=$(jq -r '.version' package.json)
          tauri_version=$(jq -r '.version' src-tauri/tauri.conf.json)
          if [[ "$pkg_version" != "$tauri_version" ]]; then
            echo "package.json and tauri.conf.json version fields diverged; cannot determine release version." >&2
            exit 1
          fi
          tag="${RELEASED_TAG:-v$tauri_version}"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag."

  build-and-release:
    needs: determine-version
    if: always() && needs.determine-version.outputs.should_release == 'true'
    outputs:
      release_tag: ${{ steps.release_tag.outputs.value }}
    strategy:
      fail-fast: false
      # max-parallel: 1
      matrix:
        platform: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: ./src-tauri

      - name: Set release tag
        id: release_tag
        shell: bash
        run: echo "value=${{ needs.determine-version.outputs.release_tag }}" >> "$GITHUB_OUTPUT"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev
          build-essential libssl-dev libgtk-3-dev libayatana-appindicator3-dev
          librsvg2-dev

      - name: Build and publish with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        with:
          tagName: ${{ steps.release_tag.outputs.value }}
          # release-please already created the release with its changelog, the build adds the assets
          releaseName: "RoN Mod Manager v__VERSION__"
          includeUpdaterJson: true
          releaseDraft: false
          prerelease: false

  publish-aur:
    name: Publish to AUR
    needs: build-and-release
    if: always() && needs.build-and-release.result == 'success'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.build-and-release.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update pkgver in PKGBUILD
        run: |
          VERSION="${RELEASE_TAG#v}"
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" aur/PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" aur/PKGBUILD
          URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/RoN.Mod.Manager_${VERSION}_amd64.deb"
          SHA=$(curl -sL "$URL" | sha256sum | awk '{print $1}')
          sed -i "s|^sha256sums=.*|sha256sums=('$SHA' 'SKIP')|" aur/PKGBUILD

      - name: Publish to AUR
        if: env.ACT != 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t rsa,ecdsa,ed25519 aur.archlinux.org >> ~/.ssh/known_hosts

          mkdir -p /tmp/aur-pkg
          cp aur/PKGBUILD /tmp/aur-pkg/PKGBUILD

          docker run --rm \
            -v /tmp/aur-pkg:/pkg \
            archlinux:latest \
            bash -c "
              pacman -Sy --noconfirm pacman-contrib &&
              useradd builder &&
              chown -R builder:builder /pkg &&
              su builder -c 'cd /pkg && makepkg --printsrcinfo > .SRCINFO'
            "

          git clone \
            -c core.sshCommand="ssh -i ~/.ssh/aur -o StrictHostKeyChecking=no" \
            ssh://aur@aur.archlinux.org/ron-mod-manager-bin.git /tmp/aur-repo
          cp /tmp/aur-pkg/PKGBUILD /tmp/aur-repo/PKGBUILD
          cp /tmp/aur-pkg/.SRCINFO /tmp/aur-repo/.SRCINFO
          cd /tmp/aur-repo
          git config user.name "${{ secrets.AUR_USERNAME }}"
          git config user.email "${{ secrets.AUR_EMAIL }}"
          git config core.sshCommand "ssh -i ~/.ssh/aur -o StrictHostKeyChecking=no"
          git add PKGBUILD .SRCINFO
          git diff-index --quiet HEAD || git commit -m "Update to ${{ env.RELEASE_TAG }}"
          git push

      - name: Print PKGBUILD (local test only)
        if: env.ACT == 'true'
        run: |
          echo "=== Skipping AUR push (running in act) ==="
          echo "=== Final PKGBUILD contents ==="
          cat aur/PKGBUILD

  publish-updates:
    name: Publish updater manifest
    needs:
      - build-and-release
      - determine-version
    if: always() && needs.build-and-release.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download latest.json from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p updater
          tag="${{ needs.build-and-release.outputs.release_tag }}"
          echo "Downloading latest.json from release tag: $tag"
          gh release download "$tag" \
            -R "${{ github.repository }}" \
            -p latest.json \
            -D updater

      - name: Upload updater manifest
        uses: actions/upload-pages-artifact@v3
        with:
          path: updater

      - name: Deploy updater manifest to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Remove latest.json and .sig files from release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.build-and-release.outputs.release_tag }}"
          echo "Cleaning assets for release tag: $tag"

          release_json=$(gh api "repos/${{ github.repository }}/releases/tags/$tag")

          asset_ids=$(echo "$release_json" | jq -r '
            .assets[]
            | select(
                .name == "latest.json"
                or ((.name // "") | endswith(".sig"))
              )
            | .id
          ')

          if [ -z "$asset_ids" ]; then
            echo "No deletable assets found."
            exit 0
          fi

          echo "Deleting assets:"
          echo "$asset_ids"

          for id in $asset_ids; do
            gh api "repos/${{ github.repository }}/releases/assets/$id" -X DELETE
            echo "Deleted asset ID: $id"
          done

          echo "Cleanup complete."